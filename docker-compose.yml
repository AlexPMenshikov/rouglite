version: '3.8'

services:
  rouglite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rouglite-game
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (res) => { if (res.statusCode !== 200) process.exit(1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - rouglite-network

networks:
  rouglite-network:
    driver: bridge